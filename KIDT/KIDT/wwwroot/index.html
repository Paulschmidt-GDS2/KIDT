<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>KIDT</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/calendar-components.css" />
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/material-base.css" />
    <link rel="stylesheet" href="KIDT.styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        // Theme-Helper: setzt data-theme Attribut auf html-Element
        window.setTheme = function(theme) {
            document.documentElement.setAttribute('data-theme', theme);
        };

        // Textarea-Helper direkt inline
        window.textareaHelper = {
            clearAndReset: function(elementId) {
                const textarea = document.getElementById(elementId);
                if (textarea) {
                    textarea.value = '';
                    textarea.rows = 1;
                    textarea.style.height = 'auto';
                }
            },

            setupEnterHandler: function(elementId, dotnetHelper) {
                const textarea = document.getElementById(elementId);
                if (textarea) {
                    textarea.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault(); // Verhindere Newline SOFORT!
                            dotnetHelper.invokeMethodAsync('OnEnterPressed'); // Rufe Blazor-Methode auf
                        }
                    });
                }
            }
        };

        // Auto-Scroll Helper für Chat-Nachrichten
        window.chatScrollHelper = {
            userHasScrolledUp: false, // Flag: Hat User manuell hochgescrollt?
            messagesElement: null, // Referenz auf .messages Element

            init: function(messagesElement) {
                this.messagesElement = messagesElement;
                this.userHasScrolledUp = false;

                // Event-Listener für User-Scroll
                messagesElement.addEventListener('scroll', () => {
                    const isAtBottom = messagesElement.scrollHeight - messagesElement.scrollTop <= messagesElement.clientHeight + 50;
                    this.userHasScrolledUp = !isAtBottom; // User hat hochgescrollt wenn nicht am Ende
                });
            },

            scrollToBottom: function() {
                if (!this.userHasScrolledUp && this.messagesElement) {
                    this.messagesElement.scrollTop = this.messagesElement.scrollHeight; // Scroll zum Ende
                }
            },

            forceScrollToBottom: function() {
                if (this.messagesElement) {
                    this.messagesElement.scrollTop = this.messagesElement.scrollHeight; // Scroll zum Ende (erzwungen)
                    this.userHasScrolledUp = false; // Reset Flag
                }
            }
        };
    </script>
    
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
